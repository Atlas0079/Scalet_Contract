site_name: 铁眼
site_description: 《铁眼》的玩法、系统与世界观设定百科
use_directory_urls: true
dev_addr: 127.0.0.1:8765
theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/book-open-page-variant
  palette:
    scheme: default
    primary: custom
    accent: blue
  features:
  - navigation.sections
  - navigation.top
  - search.highlight
  - search.suggest
  custom_dir: overrides
hooks:
- article_layout.py
- search_fix.py
plugins:
- search:
    lang: zh
    jieba_dict_user: search-dictionary.txt
markdown_extensions:
- attr_list
- tables
- toc:
    permalink: true
extra_css:
- stylesheets/wiki.css
